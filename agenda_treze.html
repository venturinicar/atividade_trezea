<!DOCTYPE html> 
<html lang="pt-br"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <meta http-equiv="X-UA-Compatible" content="ie=edge"> 
    <title>Agenda13</title>
    <!--CSS Externo-->
    <link rel="stylesheet" type="text/css" href="estilo.css"> 
    <!--CSS Reset-->
    <link rel="stylesheet"href="reset.css">
    
    <!--CSS Interno-->
    <style>
    .destaque-topo {
        text-align: center;
        background-color: #0906f1;
        color: #f7f7ef;
        padding: 20px 0;
        font-size: 2rem;
        letter-spacing: 1.5px;
    }
    </style> 
</head> 
<body > 
    <!--Titulo principal com estilo inline-->
    <header>
         <h1 class="destaque-topo" style="text-transform: uppercase;">MEU PORTAL DE ENTRETENIMENTO DIGITAL</h1> 
    </header>

    <!--Container flexbox organizando tresseções ldo a lado-->
    <main class="container-principal"> 
        <!--Seção 1: Filmes e Séries-->
        <section class="secao secao-filmes" id="filmes"> 
            <h2 class="titulo-secao">FILMES E SÉRIES</h2>
            <p class="texto explicativo">Veja a critica e comentários dos ultimos lançamentos.</p>
            <div class="galeria-imagens">
                <figure>
                    <img src="imagens/romance.jpg" alt="romance"> 
                    <figcaption class="legenda-img">Romance</figcaption>
                </figure>
                <figure>
                    <img src="imagens/serie_drama.jpg" alt="drana"> 
                    <figcaption class="legenda-img">Drama</figcaption>
                </figure>
                <figure>
                    <img src="imagens/ficcao_cientifica.jpg"alt="ficcao_cientifica">
                    <figcaption class="legenda-img">Ficção Cientifica</figcaption>
                </figure>
            </div>
        </section>

    <!--Seção2: Filmes e Séries-->
        <section class="secao secao-musica" id="musica"> 
            <h2 class="titulo-secao">MÚSICAS E PODCASTS</h2>
            <p class="texto explicativo">Fim de semana chegando, veja programações e entretenimentos.</p>
            <div class="galeria-imagens">
                <figure>
                    <img src="imagens/podcasts.jpg" alt="podcast">
                    <figcaption class="legenda-img">Podcasts</figcaption>
                </figure>
                <figure>
                     <img src="imagens/festivais.jpg" alt="festivais"> 
                    <figcaption class="legenda-img">Festivais</figcaption>
                </figure>
                <figure>
                    <img src="imagens/concertos.jpg" alt="concertos">
                    <figcaption class="legenda-img">Concertos</figcaption>
                </figure>
            </div>
        </section> 
    <!--Seção 3: Games e Tecnologia-->
        <section class="secao secao-games"id="games"> 
            <h2 class="titulo-secao">GAMES E TECNOLOGIA</h2>
            <p class="texto explicativo">Fique por dentro das inovações e tecnologias do momento.</p>
            <div class="galeria-imagens">
                <figure>
                    <img src="imagens/lancamentos.jpg" alt="lançamentos"> 
                    <figcaption class="legenda-img">Robotica</figcaption>
                </figure>
                <figure>
                    <img src="imagens/games_ia.jpg" alt="games">
                    <figcaption class="legenda-img">Inteligencia Artificial</figcaption>
                </figure>
                <figure>
                    <img src="imagens/robotica.jpg" alt="robotica">
                    <figcaption class="legenda-img">Games lançamentos</figcaption>
                </figure>
            </div>
        </section>
    </main> 

</body> 
</html>
